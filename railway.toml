[build]
builder = "nixpacks"
[nixpacks]
providers = ["nodejs_22"]

[deploy]
preDeployCommand = "npx prisma generate && npx prisma db push"

# NOTE: Never add seed/migration backfills here. preDeployCommand runs on EVERY deploy.
# Run `npx tsx prisma/seed.ts` manually only when provisioning a new environment.
# Set these in Railway Dashboard → Variables, NOT in .env:
#   DATABASE_URL, AUTH_SECRET, AUTH_URL, DEEPSEEK_API_KEY, DEEPSEEK_MODEL_PRO, DEEPSEEK_MODEL_FLASH
# The .env file is excluded from build via .dockerignore to prevent secret exposure in Docker layers.
